<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Micro Mayhem</title>
<style>
@font-face{font-family:"Fredoka One";src:url(fonts/fredoka-one-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:block}
/* Layout: ink console shell — sticker HUD on top, one tall play screen filling the rest. Single deliberate look (brand palette), not theme-switched. */
:root{
  --zap:#FFE34B; --pink:#FF4D6D; --blue:#2D8CFF; --mint:#36DEBB; --purple:#8B5CF6; --orange:#FF9F3D; --cream:#FFF8E9; --ink:#17121F;
  --ink-2:#2A2238;
  --display:"Fredoka One","Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  --ui:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;margin:0}
body{background:var(--ink);color:var(--cream);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:var(--ui)}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-top:max(10px, env(safe-area-inset-top, 0px));padding-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
#lives{display:flex;gap:4px}
#lives svg{width:28px;height:26px;display:block;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
#lives svg.gone{opacity:.25;transform:scale(.8)}
.pill{font-family:var(--display);font-size:16px;color:var(--ink);background:var(--zap);border:3px solid var(--ink);border-radius:999px;padding:3px 14px;box-shadow:0 3px 0 #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-family:var(--ui);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
#scoreN{min-width:44px;height:44px;box-sizing:border-box;border-radius:50%;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 #000;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
#stage{flex:1;min-height:0;position:relative;border-radius:26px;background:var(--ink);overflow:hidden;border:4px solid #000;box-shadow:0 6px 0 #000}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.logo{font-family:var(--display);font-weight:400;line-height:.86;margin:0;transform:rotate(-5deg);display:flex;flex-direction:column;align-items:center}
.logo span{display:inline-block;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:5px 7px 0 var(--ink)}
.logo .w1{font-size:clamp(50px,15vw,84px);color:#fff;letter-spacing:.01em}
.logo .w2{font-size:clamp(50px,15vw,92px);white-space:nowrap}
.logo .w2 span:nth-child(1){color:var(--pink);transform:rotate(-4deg)}
.logo .w2 span:nth-child(2){color:var(--zap);transform:translateY(-3px) rotate(3deg)}
.logo .w2 span:nth-child(3){color:var(--blue);transform:rotate(-2deg)}
.logo .w2 span:nth-child(4){color:var(--mint);transform:translateY(3px) rotate(4deg)}
.logo .w2 span:nth-child(5){color:var(--purple);transform:rotate(-3deg)}
.logo .w2 span:nth-child(6){color:var(--pink);transform:translateY(-2px) rotate(2deg)}
.tag{font-family:var(--display);font-size:18px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;transform:rotate(2deg);box-shadow:3px 4px 0 var(--ink)}
.btn{font-family:var(--display);font-size:30px;letter-spacing:.02em;color:var(--ink);background:var(--zap);border:4px solid var(--ink);border-radius:999px;padding:12px 46px;box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.btn:active{transform:translateY(5px) scale(.97,.94);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.round:focus-visible{outline:3px solid #fff;outline-offset:4px}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.round{width:52px;height:52px;border-radius:50%;background:var(--cream);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.round svg{width:26px;height:26px}
.best{font-family:var(--display);font-size:16px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--ink);display:flex;gap:6px;align-items:center}
.best svg{width:20px;height:20px}
button.best{cursor:pointer}button.best:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}button.best:focus-visible{outline:3px solid #fff;outline-offset:3px}

#over{background:rgba(23,18,31,.55)}
.card{background:var(--ink);border:4px solid #000;border-radius:24px;box-shadow:0 8px 0 #000, 0 0 0 4px var(--zap) inset;padding:22px 22px 26px;width:min(300px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:center}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:.95;color:var(--pink);-webkit-text-stroke:6px #000;paint-order:stroke fill;text-shadow:3px 5px 0 #000;transform:rotate(-3deg);text-wrap:balance}
.stats{width:100%;display:grid;gap:6px}
.stats div{display:flex;justify-content:space-between;font-family:var(--ui);font-weight:600;font-size:16px;color:var(--cream)}
.stats b{font-family:var(--display);font-weight:400;color:var(--zap);font-variant-numeric:tabular-nums}
.chip{font-family:var(--display);font-size:16px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.on{background:var(--mint)}
.chip.ghost{background:transparent;color:var(--cream);border-color:var(--cream);box-shadow:none;font-size:13px}
.chip:focus-visible{outline:3px solid #fff;outline-offset:3px}
#tester{background:var(--purple);justify-content:flex-start;padding:0;overflow-y:auto}
.tpanel{width:100%;box-sizing:border-box;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px;text-align:left}
.thead{display:flex;justify-content:space-between;align-items:center}
.thead h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--zap);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink)}
.tlabel{font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream)}
.speeds{display:flex;gap:8px;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:15px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tile small{font-family:var(--ui);font-weight:600;font-size:12px;padding:2px 8px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile small.good{background:var(--mint)}.tile small.mid{background:var(--zap)}.tile small.bad{background:var(--pink);color:#fff}
.testbar{position:absolute;left:12px;right:12px;bottom:56px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;background:var(--ink);border:4px solid #000;border-radius:20px;box-shadow:0 0 0 3px var(--zap) inset}
.tres{font-family:var(--ui);font-weight:600;font-size:15px;color:var(--cream);text-align:center}
.tres b{font-family:var(--display);font-weight:400;color:var(--zap)}
.btn.small{font-size:20px;padding:8px 26px;box-shadow:0 5px 0 #000}
@media (prefers-reduced-motion:reduce){.btn:active,.round:active{transform:none}#lives svg{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="lives" aria-label="Lives left"></div>
    <div class="pill"><small>Stage</small><span id="stageN">1</span> · <span id="gameN">1</span>/5</div>
    <div id="scoreN" aria-label="Score">0</div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="menu">
      <h1 class="logo" aria-label="Micro Mayhem"><span class="w1">MICRO</span><span class="w2"><span>M</span><span>A</span><span>Y</span><span>H</span><span>E</span><span>M</span></span></h1>
      <div class="tag">Tiny games. Total chaos.</div>
      <button class="btn pink" id="play">PLAY</button>
      <div class="row">
        <button class="best" id="bestMenu" aria-label="Leaderboard"><svg viewBox="0 0 24 24"><path d="M6 3h12v4a6 6 0 0 1-12 0z M6 5H3a3 3 0 0 0 3 4 M18 5h3a3 3 0 0 1-3 4 M9 14h6l1 5H8z" fill="#FFE34B" stroke="#17121F" stroke-width="2" stroke-linejoin="round"/></svg><span>Best 0</span></button>
        <button class="round" id="sound" aria-label="Sound on"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
        <button class="round" id="haptics" aria-label="Vibration on"><svg viewBox="0 0 24 24" id="hapticsIcon"></svg></button>
      </div>
    </div>
    <div class="overlay" id="tester" hidden>
      <div class="tpanel">
        <div class="thead"><h2>Tester</h2><button class="chip" id="closeTester">Back</button></div>
        <div class="tlabel">Speed</div>
        <div class="speeds" id="speeds"></div>
        <div class="tlabel">Pick a game · wins / tries at this speed</div>
        <div class="tgrid" id="tgrid"></div>
        <button class="chip ghost" id="resetStats">Reset tallies</button>
      </div>
    </div>
    <div class="testbar" id="testbar" hidden>
      <div class="tres" id="tres"></div>
      <div class="row"><button class="btn small" id="tAgain">AGAIN</button><button class="chip" id="tPick">Pick game</button></div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2 id="overTitle">GAME OVER!</h2>
        <div class="stats">
          <div>Score<b id="finalScore">0</b></div>
          <div>Stage reached<b id="finalStage">1</b></div>
          <div>Best<b id="finalBest">0</b></div>
        </div>
        <button class="btn" id="again">AGAIN!</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
// ---------- native bridge (Capacitor plugins in the iOS app; harmless no-ops in a browser) ----------
const NP=(window.Capacitor&&window.Capacitor.Plugins)||{};
const LEADERBOARD='micromayhem.highscore';
const Store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}if(NP.Preferences)NP.Preferences.set({key:k,value:String(v)}).catch(()=>{})}};
// Haptics: every interaction has a matching tap on the Taptic Engine. Toggle saved as mm-haptics.
let hapticsOn=Store.get('mm-haptics')!=='0',lastBuzz=0;
const HAPTIC={tick:'LIGHT',puff:'LIGHT',fizz:'LIGHT',pop:'MEDIUM',squish:'MEDIUM',plop:'MEDIUM',slice:'MEDIUM',whoosh:'LIGHT',thud:'HEAVY',ding:'MEDIUM',up:'HEAVY',tap:'LIGHT'};
function buzz(kind){const h=NP.Haptics;if(!h||!hapticsOn)return;const now=performance.now();
  if(kind==='win'){h.notification({type:'SUCCESS'}).catch(()=>{});lastBuzz=now;return}
  if(kind==='lose'){h.notification({type:'ERROR'}).catch(()=>{});lastBuzz=now;return}
  if(kind==='best'){[0,110,220].forEach(d=>setTimeout(()=>h.impact({style:'HEAVY'}).catch(()=>{}),d));return}
  const style=HAPTIC[kind];if(!style||now-lastBuzz<35)return;lastBuzz=now;h.impact({style}).catch(()=>{})}
// Motion: native CoreMotion stream (no permission prompt). Runs only during tilt/shake games.
const M={live:false,on:false,gx:0,gy:0,ax:0,kicks:0,lastSign:0,lastKick:0};
if(NP.NativeMotion){try{NP.NativeMotion.addListener('motion',d=>{M.live=true;M.gx=M.gx*.6+d.gx*.4;M.gy=d.gy;M.ax=d.ax;
  const now=performance.now(),sg=Math.sign(d.ax);if(Math.abs(d.ax)>0.9&&sg!==M.lastSign&&now-M.lastKick>70){M.lastSign=sg;M.lastKick=now;M.kicks++}})}catch(e){}}
const Motion={start(){if(NP.NativeMotion&&!M.on){M.on=true;NP.NativeMotion.start().catch(()=>{})}},stop(){if(NP.NativeMotion&&M.on){M.on=false;M.live=false;NP.NativeMotion.stop().catch(()=>{})}}};
const GC={ready:false,
  auth(){if(!NP.GameCenter)return;NP.GameCenter.authenticate().then(r=>{GC.ready=!!(r&&r.authenticated);if(GC.ready)Ach.resend()}).catch(()=>{})},
  submit(score){if(NP.GameCenter&&score>0)NP.GameCenter.submitScore({leaderboardId:LEADERBOARD,score}).catch(()=>{})},
  show(){if(NP.GameCenter)NP.GameCenter.showLeaderboard({leaderboardId:LEADERBOARD}).catch(()=>{})}};
// Achievements: earned ones are kept on the phone and (re)sent to Game Center until Apple confirms them.
const ACH={firstrun:'micromayhem.firstrun',stage5:'micromayhem.stage5',maxspeed:'micromayhem.maxspeed',flawless:'micromayhem.flawless',
  score50:'micromayhem.score50',score100:'micromayhem.score100',collector:'micromayhem.collector',handsoff:'micromayhem.handsoff'};
const jsonSet=k=>{try{return new Set(JSON.parse(Store.get(k)||'[]'))}catch(e){return new Set()}};
const Ach={earned:jsonSet('mm-ach'),sent:jsonSet('mm-ach-sent'),won:jsonSet('mm-won'),hands:+(Store.get('mm-notouch')||0)||0,
  save(){Store.set('mm-ach',JSON.stringify([...this.earned]));Store.set('mm-ach-sent',JSON.stringify([...this.sent]))},
  send(id){if(!NP.GameCenter||this.sent.has(id))return;NP.GameCenter.reportAchievement({achievementId:id}).then(r=>{if(r&&r.reported){this.sent.add(id);this.save()}}).catch(()=>{})},
  unlock(key){const id=ACH[key];if(!id||this.earned.has(id))return;this.earned.add(id);this.save();this.send(id)},
  resend(){for(const id of this.earned)this.send(id)},
  gameWon(id){if(!this.won.has(id)){this.won.add(id);Store.set('mm-won',JSON.stringify([...this.won]))}
    if(id==='notouch'){this.hands++;Store.set('mm-notouch',this.hands);if(this.hands>=10)this.unlock('handsoff')}
    if(GAMES.every(g=>this.won.has(g.id)))this.unlock('collector')}};
const W=360,H=600;
const C={y:'#FFE34B',pk:'#FF4D6D',bl:'#2D8CFF',mt:'#36DEBB',pu:'#8B5CF6',or:'#FF9F3D',cr:'#FFF8E9',ink:'#17121F',
  red:'#EE3A43',gold:'#FFC52E',brown:'#8A5532',skin:'#F6C59E',grey:'#B8C0CC',white:'#FFFFFF',green:'#2FB352',tea:'#9A5B2E'};
const INK=C.ink;
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)').matches:false;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0,dpr=1,clock=0;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(3,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;scale=Math.min(r.width/W,r.height/H);ox=(r.width-W*scale)/2;oy=r.height-H*scale;}
window.addEventListener('resize',resize);resize();

// ---------- design system: drawing ----------
const rnd=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2, pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const backOut=k=>{const s=2.2;k=clamp(k,0,1)-1;return k*k*((s+1)*k+s)+1};
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return dist(px,py,ax+t*dx,ay+t*dy);}
const shadeCache={};
function darken(hex,a){const k=hex+a;if(shadeCache[k])return shadeCache[k];const n=parseInt(hex.slice(1),16);const r=(n>>16)*(1-a)|0,g=(n>>8&255)*(1-a)|0,b=(n&255)*(1-a)|0;return shadeCache[k]='rgb('+r+','+g+','+b+')'}
// Every filled sticker shape: bottom-right cel shade + thick ink outline
function shape(p,f,sz){if(f){ctx.save();if(f[0]==='#'&&f.length===7&&sz>11){ctx.clip(p);ctx.fillStyle=darken(f,.2);ctx.fill(p);const o=clamp(sz*.15,2,8);ctx.translate(-o,-o);ctx.fillStyle=f;ctx.fill(p)}else{ctx.fillStyle=f;ctx.fill(p)}ctx.restore()}ctx.stroke(p)}
function circle(x,y,r,f){const p=new Path2D();p.arc(x,y,Math.max(.1,r),0,TAU);shape(p,f,r)}
function ellipse(x,y,rx,ry,f,rot){const p=new Path2D();p.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);shape(p,f,Math.min(rx,ry))}
function box(x,y,w,h,f,r){const p=new Path2D();if(p.roundRect)p.roundRect(x,y,w,h,Math.min(r==null?8:r,Math.abs(w)/2,Math.abs(h)/2));else p.rect(x,y,w,h);shape(p,f,Math.min(Math.abs(w),Math.abs(h))/2)}
function poly(pts,f){const p=new Path2D();let a=1e9,b=-1e9,c=1e9,d=-1e9;pts.forEach((q,i)=>{i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]);a=Math.min(a,q[0]);b=Math.max(b,q[0]);c=Math.min(c,q[1]);d=Math.max(d,q[1])});p.closePath();shape(p,f,Math.min(b-a,d-c)/2)}
function flat(fn,f){ctx.beginPath();fn();ctx.closePath();if(f){ctx.fillStyle=f;ctx.fill()}ctx.stroke()}
function line(a,b,c,d,w,col){ctx.save();if(w)ctx.lineWidth=w;if(col)ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();ctx.restore()}
function gloss(x,y,rx,ry,rot){ctx.save();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot==null?-.6:rot,0,TAU);ctx.fill();ctx.restore()}
function star(x,y,r,f,n,inner){n=n||5;inner=inner||.5;const pts=[];for(let i=0;i<n*2;i++){const a=i/(n*2)*TAU-Math.PI/2,rr=i%2?r*inner:r;pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}poly(pts,f)}
function splat(x,y,r,f,seed){seed=seed||1;const pts=[];for(let i=0;i<16;i++){const a=i/16*TAU,rr=r*(i%2?.6:1)*(.8+.28*Math.sin(seed*7+i*2.3));pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}poly(pts,f)}
function speedLines(x,y,dir,len,n){ctx.save();ctx.lineWidth=4;ctx.strokeStyle=INK;for(let i=0;i<(n||3);i++){const o=(i-((n||3)-1)/2)*14;const px=-Math.sin(dir)*o,py=Math.cos(dir)*o;line(x+px,y+py,x+px+Math.cos(dir)*len*(i===1?1:.7),y+py+Math.sin(dir)*len*(i===1?1:.7))}ctx.restore()}
function qb(u,A,Cc,B){const v=1-u;return[v*v*A[0]+2*v*u*Cc[0]+u*u*B[0],v*v*A[1]+2*v*u*Cc[1]+u*u*B[1]]}
function arrow(x,y,dir,t,col){ctx.save();const k=RM?1:1+.12*Math.sin(t*10);ctx.translate(x,y);ctx.rotate(dir);ctx.scale(k,k);poly([[0,-28],[20,-2],[8,-2],[8,24],[-8,24],[-8,-2],[-20,-2]],col||C.white);ctx.restore()}
function text(t,x,y,size,fill,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.font=size+'px "Fredoka One","Fredoka",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  const sw=Math.max(4,size*.2);ctx.lineWidth=sw;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.strokeText(t,size*.06,size*.1);ctx.fillText(t,size*.06,size*.1);ctx.strokeText(t,0,0);ctx.fillStyle=fill||C.white;ctx.fillText(t,0,0);ctx.restore()}
// Expressive face, used selectively: scared, angry, happy, panic, dead, neutral
function face(x,y,s,mood,lx,ly){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=3/s*1.1;lx=lx||0;ly=ly||0;
  const eye=(ex)=>{if(mood==='dead'){line(ex-5,-9,ex+5,1,3.2);line(ex+5,-9,ex-5,1,3.2);return}const er=mood==='scared'||mood==='panic'?8:7;ctx.beginPath();ctx.arc(ex,-4,er,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(ex+lx*2,-4+ly*2,mood==='panic'?2:3.4,0,TAU);ctx.fillStyle=INK;ctx.fill()};
  eye(-10);eye(10);
  if(mood==='angry'){line(-18,-17,-4,-11,4);line(18,-17,4,-11,4)}
  if(mood==='scared'||mood==='panic'){ctx.beginPath();ctx.arc(-10,-18,7,Math.PI*1.15,Math.PI*1.85);ctx.stroke();ctx.beginPath();ctx.arc(10,-18,7,Math.PI*1.15,Math.PI*1.85);ctx.stroke()}
  ctx.fillStyle=INK;
  if(mood==='scared'){ctx.beginPath();ctx.ellipse(0,11,5,7,0,0,TAU);ctx.fill()}
  else if(mood==='panic'){ctx.beginPath();ctx.moveTo(-9,11);for(let i=0;i<=6;i++)ctx.lineTo(-9+i*3,11+(i%2?-3:3));ctx.stroke()}
  else if(mood==='angry'){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-10,6,20,9,3);else ctx.rect(-10,6,20,9);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();line(-10,10.5,10,10.5,2)}
  else if(mood==='happy'){ctx.beginPath();ctx.arc(0,5,8,.15*Math.PI,.85*Math.PI);ctx.closePath();ctx.fill();ctx.stroke()}
  else if(mood==='dead'){ctx.beginPath();ctx.moveTo(-8,12);ctx.quadraticCurveTo(-4,7,0,12);ctx.quadraticCurveTo(4,17,8,12);ctx.stroke()}
  else{line(-5,10,5,10,3)}
  ctx.restore()}
// Backgrounds: one strong colour per game + restrained tonal pattern
function backdrop(c,pat,cx,cy){ctx.fillStyle=c;ctx.fillRect(0,-1200,W,H+1200);ctx.save();
  if(pat==='burst'){ctx.translate(cx==null?180:cx,cy==null?300:cy);ctx.rotate(RM?0:clock*.06);ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();for(let i=0;i<18;i++){ctx.moveTo(0,0);ctx.arc(0,0,900,i/18*TAU,(i+.5)/18*TAU);ctx.closePath()}ctx.fill()}
  else if(pat==='dots'){ctx.fillStyle='rgba(23,18,31,.10)';ctx.beginPath();for(let y=-592,r=0;y<H;y+=20,r++)for(let x=(r%2)*10;x<W+10;x+=20){const rr=1.2+2.6*clamp(y/H,0,1);ctx.moveTo(x+rr,y);ctx.arc(x,y,rr,0,TAU)}ctx.fill()}
  else if(pat==='stripes'){ctx.fillStyle='rgba(255,255,255,.11)';ctx.rotate(-.5);for(let i=-20;i<20;i++)ctx.fillRect(i*48+(RM?0:(clock*10)%48),-400,22,1600)}
  else if(pat==='clouds'){ctx.fillStyle='rgba(255,255,255,.55)';const cl=(x,y,s)=>{ctx.beginPath();ctx.arc(x,y,22*s,0,TAU);ctx.arc(x+24*s,y-10*s,26*s,0,TAU);ctx.arc(x+50*s,y,20*s,0,TAU);ctx.rect(x,y,50*s,20*s);ctx.fill()};const d=RM?0:(clock*8)%460;cl(40+d-100,120,1);cl(240+d*.6-200,230,.8);cl(120-d*.4+60,470,1.1)}
  ctx.restore()}
function ground(y,c){ctx.fillStyle=c;ctx.fillRect(0,y,W,H-y);line(0,y,W,y,5)}

// ---------- particles, shake ----------
let fx=[],shakeT=0;
function confetti(x,y,n){const cols=[C.y,C.pk,C.bl,C.mt,C.pu,C.or];n=RM?Math.min(n,8):n;for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(160,420);fx.push({k:i%3?'conf':'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-160,r:rnd(5,9),c:pick(cols),rot:rnd(0,6),vr:rnd(-10,10),life:rnd(.6,1)})}}
function drops(x,y,n,c){for(let i=0;i<n;i++){const a=rnd(Math.PI*1.05,Math.PI*1.95),v=rnd(120,320);fx.push({k:'drop',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(4,8),c,rot:0,vr:0,life:rnd(.4,.7)})}}
function sparkle(x,y,n,c){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(60,180);fx.push({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(5,9),c:c||C.y,rot:rnd(0,6),vr:rnd(-6,6),life:rnd(.35,.6)})}}
function stepFx(dt){for(const p of fx){p.life-=dt;p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}fx=fx.filter(p=>p.life>0)}
function drawFx(){ctx.save();ctx.lineWidth=2.5;for(const p of fx){ctx.save();ctx.globalAlpha=clamp(p.life*2.5,0,1);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  if(p.k==='conf'){ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9);ctx.strokeRect(-p.r,-p.r*.45,p.r*2,p.r*.9)}
  else if(p.k==='drop'){ctx.beginPath();ctx.arc(0,0,p.r,0,TAU);ctx.fillStyle=p.c;ctx.fill();ctx.stroke()}
  else{const pts=[];ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,rr=i%2?p.r*.45:p.r;i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=p.c;ctx.fill();ctx.stroke()}
  ctx.restore()}ctx.restore()}

// ---------- the games (mechanics unchanged; art restyled) ----------
// Reflex-timing games scale gentler than the clock: returns a factor so real-time windows shrink only by speed^0.35
function tempo(def,G){const spd=G&&G.dur?def.time/G.dur:1;return Math.pow(spd,.65)}
function pinShape(x,y,sc,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(sc,sc);ellipse(0,12,14,22,C.white);ellipse(0,-14,8,11,C.white);box(-9,-5,18,6,C.red,2);ctx.restore()}
function sheep(x,y,flip,mood){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.lineWidth=5;line(-16,14,-16,40,6);line(-2,16,-2,42,6);line(14,14,14,40,6);
 const P=[[-24,-4,18],[-4,-14,20],[18,-6,18],[-12,10,18],[10,10,18],[0,0,20]];ctx.beginPath();for(const q of P){ctx.moveTo(q[0]+q[2],q[1]);ctx.arc(q[0],q[1],q[2],0,TAU)}ctx.lineWidth=10;ctx.strokeStyle=INK;ctx.stroke();ctx.fillStyle=C.cr;ctx.fill();
 ctx.lineWidth=4.5;ellipse(34,-6,15,18,INK);ellipse(24,-18,8,4,INK,-.6);face(36,-4,.42,mood);ctx.restore()}
function carrot(x,ty,mood,rot){ctx.save();ctx.translate(x,ty);ctx.rotate(rot||0);ellipse(-14,-28,8,26,C.green,-.4);ellipse(14,-28,8,26,C.green,.4);ellipse(0,-34,8,30,C.green);
 poly([[-30,0],[30,0],[5,140],[-5,140]],C.or);ctx.save();ctx.lineWidth=3;line(-22,56,-10,56);line(10,82,20,82);line(-14,104,-6,104);ctx.restore();face(0,30,.6,mood);ctx.restore()}

function nextDef(){if(run.test)return run.test;if(!run.deck.length){run.deck=shuffle(GAMES.slice());if(run.deck[run.deck.length-1]===run.last)run.deck.unshift(run.deck.pop())}return run.deck.pop()}
function startNext(){const def=nextDef();run.last=def;const s={T:0};fx=[];G={def,s,t:0,dur:def.time/run.speed,res:null,endAt:0,resT:0,msg:''};
 G.win=()=>{if(G.res)return;G.res='win';buzz('win');G.msg=pick(['NICE!','MAYHEM!','BOOM!','YES!','NAILED IT!']);G.resT=G.t;G.endAt=G.t+.75;confetti(180,290,26);sfx('win')};
 G.lose=(m)=>{if(G.res)return;G.res='lose';buzz('lose');G.msg=m||pick(['NOPE!','WHOOPS!']);G.resT=G.t;G.endAt=G.t+.9;if(shakeT<.2)shakeT=.22;sfx('lose')};
 if(def.motion)Motion.start();else Motion.stop();def.init(s,G);mode='play';hud()}

 document.getElementById('menu').hidden=true;document.getElementById('over').hidden=true;mode='go';goT=0;sfx('up')}
function finish(){Motion.stop();
 if(run.test){const k=run.test.id+'@'+run.speed,r=tstats[k]||(tstats[k]=[0,0]);r[1]++;if(G.res==='win'){r[0]++;run.score++}saveStats();hud();

 if(run.lives<=0){mode='over';GC.submit(run.score);Ach.unlock('firstrun');if(run.score>bestScore){bestScore=run.score;Store.set('mm-best',bestScore);buzz('best')}

 o.type=set[0];o.frequency.setValueAtTime(set[1],t);o.frequency.exponentialRampToValueAtTime(set[2],t+set[3]);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+set[3]);o.start(t);o.stop(t+set[3]+.02)}

  const rate=r&&r[1]?r[0]/r[1]:null,cls=rate==null?'':rate>=.75?'good':rate>=.4?'mid':'bad';

function openTester(){mode='menu';G=null;run=null;hud();$('menu').hidden=true;$('over').hidden=true;$('testbar').hidden=true;renderTester();$('tester').hidden=false}
function startTest(d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}
 run={lives:LIVES,score:run&&run.test===d?run.score:0,played:0,stage:0,speed:tSpeed,deck:[],last:null,test:d};$('tester').hidden=true;$('testbar').hidden=true;startNext()}
// Hidden for release: tap the logo 5 times within 2 seconds to open the tester.
{let taps=[];document.querySelector('.logo').addEventListener('click',()=>{const now=Date.now();taps=taps.filter(t=>now-t<2000);taps.push(now);if(taps.length>=5){taps=[];openTester()}})}
document.getElementById('bestMenu').addEventListener('click',()=>{buzz('tap');GC.show()});
// Restore saved best score and tester tallies from native storage (survives iOS clearing web storage).
if(NP.Preferences){Promise.all(['mm-best','mm-test','mm-ach','mm-ach-sent','mm-won','mm-notouch'].map(k=>NP.Preferences.get({key:k}).then(r=>r&&r.value).catch(()=>null))).then(([b,t,ae,as,aw,an])=>{
  const merge=(v,set)=>{try{for(const x of JSON.parse(v||'[]'))set.add(x)}catch(e){}};merge(ae,Ach.earned);merge(as,Ach.sent);merge(aw,Ach.won);if(an&&+an>Ach.hands)Ach.hands=+an;Ach.save();if(GC.ready)Ach.resend();
  if(b!=null&&+b>bestScore){bestScore=+b;try{localStorage.setItem('mm-best',bestScore)}catch(e){}bestLabels()}
  if(t){try{const o=JSON.parse(t);if(o&&typeof o==='object'){tstats=Object.assign(o,tstats);}}catch(e){}}})}
GC.auth();
// Wake audio again after the app comes back from the background.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.resume)ac.resume().catch(()=>{})});
$('closeTester').addEventListener('click',()=>{$('tester').hidden=true;$('menu').hidden=false});
$('tPick').addEventListener('click',openTester);
$('tAgain').addEventListener('click',()=>startTest(run.test));
$('resetStats').addEventListener('click',()=>{tstats={};saveStats();renderTester()});

// ---------- render ----------
function drawTimer(){const frac=G&&mode==='play'?clamp(1-(G.res?G.resT:G.t)/G.dur,0,1):1;ctx.fillStyle=INK;ctx.fillRect(0,556,W,44);
 const x0=26+(1-frac)*262;ctx.save();ctx.lineWidth=9;ctx.strokeStyle='#000';line(x0,578,300,578,9,'#000');ctx.setLineDash([9,5]);line(x0,578,300,578,5,frac<.3?C.pk:C.or);ctx.restore();
 const low=frac<.3&&G&&!G.res&&mode==='play',bs=low&&!RM?1+.08*Math.sin(clock*30):1;ctx.save();ctx.translate(322,578);ctx.scale(bs,bs);circle(0,0,17,'#3A3348');box(-5,-24,10,8,C.grey,2);gloss(-6,-6,3,5);face(0,2,.42,low?'panic':'neutral');ctx.restore();
 if(mode==='play'&&G&&!G.res){star(x0,578,10+(RM?0:3*Math.sin(clock*40)),C.y,6,.45)}}
function drawResult(){const k=clamp((G.t-G.resT)*5,0,1),e=backOut(k),win=G.res==='win';
 ctx.save();ctx.globalAlpha=.3*k;ctx.fillStyle=win?C.y:INK;ctx.fillRect(0,-1200,W,1756);ctx.restore();
 ctx.save();ctx.translate(180,290);ctx.scale(e,e);ctx.rotate(win?-.08:.06);star(0,0,win?120:104,win?C.pk:C.cr,win?14:9,win?.72:.68);ctx.restore();
 text(G.msg,180,290,Math.round(G.msg.length>7?38:50)*e+1,win?C.y:C.pk,win?-.08:.06)}
function drawMenuBg(){backdrop(C.y,'burst',180,250);
 const t=clock,b=k=>RM?0:Math.sin(t*2+k)*8;
 ctx.save();ctx.translate(58,470+b(0));ctx.rotate(-.2);ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,34);ctx.quadraticCurveTo(10,60,-4,86);ctx.stroke();ctx.lineWidth=4.5;ellipse(0,0,28,34,C.pk);gloss(-10,-12,5,10);ctx.restore();
 ctx.save();ctx.translate(300,470+b(2));ctx.rotate(.15);ellipse(0,0,22,28,C.white);gloss(-8,-12,4,8);face(0,4,.6,'scared');ctx.restore();
 ctx.save();ctx.translate(300,90+b(4));ctx.rotate(.4);flat(()=>ctx.arc(0,0,34,0,Math.PI),C.green);flat(()=>ctx.arc(0,0,27,0,Math.PI),C.pk);ctx.restore();
 ctx.save();ctx.translate(56,90+b(1));star(0,0,22,C.bl,5,.5);ctx.restore();
 ctx.save();ctx.translate(180,540+b(3)*.5);star(-80,0,12,C.mt,5,.5);star(80,0,12,C.pu,5,.5);ctx.restore();
 ctx.fillStyle=INK;ctx.fillRect(0,556,W,44)}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=INK;ctx.fillRect(0,0,cv.width,cv.height);
 let sx=0,sy=0;if(shakeT>0&&!RM){sx=rnd(-7,7)*shakeT*4;sy=rnd(-7,7)*shakeT*4}
 ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*(ox+sx*scale),dpr*(oy+sy*scale));const top=-oy/scale;ctx.save();ctx.beginPath();ctx.rect(0,top,W,H-top);ctx.clip();
 ctx.lineWidth=4.5;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.lineCap='round';
 if((mode==='play'||mode==='over'||mode==='testres')&&G){ctx.save();G.def.draw(G.s,G);ctx.restore();drawFx();drawTimer();
  if(mode==='play'&&G.t<1.05&&!G.res){const k=backOut(G.t*5),a=G.t>.85?1-(G.t-.85)/.2:1;ctx.save();ctx.globalAlpha=clamp(a,0,1);text(G.def.verb,180,74,Math.max(1,Math.round((G.def.verb.length>10?34:44)*k)),C.white,-.06);ctx.restore()}
  if(G.res)drawResult()}
 else if(mode==='banner'){backdrop(C.pk,'burst',180,280);const k=backOut(bannerT*3);
  ctx.save();ctx.translate(180,280);ctx.scale(k,k);star(0,0,140,C.y,12,.75);ctx.restore();
  text('SPEED UP!',180,262,Math.max(1,46*k),C.white,-.08);text('STAGE '+(run.stage+1),180,326,Math.max(1,26*k),C.bl,.05);
  poly([[40,120],[70,120],[56,150],[80,150],[38,206],[48,164],[28,164]],C.y);poly([[300,400],[330,400],[316,430],[340,430],[298,486],[308,444],[288,444]],C.y);drawTimer()}
 else if(mode==='go'){backdrop(C.mt,'burst',180,290);const k=backOut(goT*4);ctx.save();ctx.translate(180,290);ctx.scale(k,k);ctx.rotate(-.1);star(0,0,120,C.mt,12,.7);ctx.restore();text('GO!',180,290,Math.max(1,72*k),C.white,-.1);drawTimer()}
 else drawMenuBg();
 ctx.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;if(shakeT>0)shakeT=Math.max(0,shakeT-dt);stepFx(dt);
 if(mode==='play'&&G){G.t+=dt;const gd=dt*run.speed;G.s.T+=gd;if(G.def.update)G.def.update(G.s,gd,G);
  if(!G.res&&G.t>=G.dur){G.def.timeoutWin?G.win():G.lose('TOO SLOW!')}if(G.res&&G.t>=G.endAt)finish()}
 else if(mode==='banner'){bannerT+=dt;if(bannerT>1.2)startNext()}
 else if(mode==='go'){goT+=dt;if(goT>.6)startNext()}
 render();requestAnimationFrame(frame)}
if(document.fonts&&document.fonts.load){document.fonts.load('40px "Fredoka One"').catch(()=>{})}
requestAnimationFrame(frame);
window.__MM={GAMES,_set:(m,g)=>{mode=m;G=g}};
